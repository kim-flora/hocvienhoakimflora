<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khôi phục Bố cục và thiết kế - Kim Flora</title><style>body{font:16px/1.6 system-ui,sans-serif;max-width:680px;margin:45px auto;padding:0 20px;color:#262332}h1{font-size:1.6rem}button{padding:12px 18px;border:0;border-radius:8px;background:#594273;color:white;cursor:pointer}button:disabled{opacity:.45}input{max-width:100%}#status{white-space:pre-wrap;padding:12px 0}</style></head><body>
<h1>Khôi phục nội dung Bố cục và thiết kế</h1>
<p>Chọn file <strong>kimflora-sao-luu-website-2026-11-16T13-01-14-191Z.json</strong> (hoặc bản có tên tương tự) đã lưu trên máy. Công cụ chỉ khôi phục các bài và tiêu đề thuộc mục <strong>Bố cục và thiết kế</strong>; không thay đổi các mục màu sắc hoặc thư viện hoa.</p>
<p><input type="file" id="backup" accept=".json,application/json"></p>
<p><button id="go" disabled>Khôi phục từ bản sao lưu</button></p>
<div id="status" role="status"></div>
<p><a href="./">Trở về website</a></p>
<script>
const $=id=>document.getElementById(id),rx=/^kimflora_knowledge_(?:edit|title)_v1:.*compositionKnowledgePage:\d+$/;
let input;
$('backup').addEventListener('change',async e=>{
 $('go').disabled=true;
 try{input=JSON.parse(await e.target.files[0].text());
 const keys=[...new Set([...Object.keys(input.local||{}),...Object.keys(input.indexed||{})])].filter(k=>rx.test(k));
 if(!keys.length)throw Error('File không có nội dung Bố cục và thiết kế.');
 $('status').textContent='Đã đọc '+keys.length+' mục từ bản sao lưu. Khi khôi phục, công cụ sẽ tự tải xuống bản sao dữ liệu hiện có trước khi ghi.';
 $('go').disabled=false;
 }catch(err){$('status').textContent='Lỗi đọc file: '+err.message;}
});
function openDB(){return new Promise((resolve,reject)=>{const q=indexedDB.open('kimflora_durable_v1',1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('records'))q.result.createObjectStore('records')};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
function readAll(db){return new Promise((resolve,reject)=>{const tr=db.transaction('records','readonly'),s=tr.objectStore('records'),q=s.openCursor(),out={};q.onsuccess=()=>{const c=q.result;if(c){if(rx.test(c.key))out[c.key]=c.value;c.continue()}else resolve(out)};q.onerror=()=>reject(q.error)})}
function writeAll(db,items){return new Promise((resolve,reject)=>{const t=db.transaction('records','readwrite'),s=t.objectStore('records');for(const [k,v] of Object.entries(items))s.put(v,k);t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}
function download(data){const blob=new Blob([JSON.stringify(data)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='kimflora-truoc-khi-khoi-phuc-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
$('go').addEventListener('click',async()=>{
 $('go').disabled=true;
 try{
 const db=await openDB(),previous={format:1,capturedAt:new Date().toISOString(),local:{},indexed:await readAll(db)};
 for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(rx.test(k))previous.local[k]=localStorage.getItem(k)}
 download(previous);
 const records={};for(const [k,v] of Object.entries(input.local||{}))if(rx.test(k))records[k]=v;
 for(const [k,v] of Object.entries(input.indexed||{}))if(rx.test(k))records[k]=v;
 await writeAll(db,records);
 let localCount=0;for(const [k,v] of Object.entries(input.local||{})){if(rx.test(k)){try{localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v));localCount++}catch(e){/* IndexedDB already stores the canonical value */}}}
 $('status').textContent='Đã khôi phục '+Object.keys(records).length+' dữ liệu vào IndexedDB và '+localCount+' mục vào localStorage. Đã tải bản sao dữ liệu cũ trước khi khôi phục. Hãy mở lại website và tải lại trang (Ctrl+F5).';
 db.close();
 }catch(err){$('status').textContent='Không thể khôi phục: '+err.message+'; vui lòng giữ file sao lưu.';}
});
</script></body></html>
