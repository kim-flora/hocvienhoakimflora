name: Check portal JavaScript
on:
  push:
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse inline portal modules
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';

          for (const path of ['guest.html', 'admin-preview.html']) {
            if (path === 'admin-preview.html' && !existsSync(path)) continue;
            const page = readFileSync(path, 'utf8');
            const modules = [...page.matchAll(/<script type="module">([\s\S]*?)<\/script>/g)];
            if (!modules.length) throw new Error(`Missing inline module in ${path}`);
            for (const [, source] of modules) {
              const result = spawnSync(process.execPath, ['--input-type=module', '--check'], {
                input: source,
                encoding: 'utf8',
              });
              if (result.status !== 0) throw new Error(`${path}: ${result.stderr || result.error}`);
            }
          }
          NODE
